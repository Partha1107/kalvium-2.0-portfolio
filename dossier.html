<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subject Dossier | Kalvium Squad 138</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><path d=%22M20 20 L80 20 L80 80 L20 80 Z%22 fill=%22none%22 stroke=%22red%22 stroke-width=%228%22/><path d=%22M20 50 L80 20 M20 50 L80 80%22 fill=%22none%22 stroke=%22red%22 stroke-width=%228%22/></svg>"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Load coding stats engine first -->
    <script src="coding-stats.js" defer></script>
    <script src="dossier-page.js" defer></script>
  </head>

  <body id="dossier-body" style="overflow-y: auto">
    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-8 py-16 relative z-10">
      <!-- Back Button -->
      <a
        href="index.html"
        class="inline-flex items-center gap-3 mb-12 bg-black/50 backdrop-blur border border-white/10 text-white hover:text-red-600 hover:border-red-600 px-6 py-3 rounded-full transition-all shadow-[0_0_15px_rgba(0,0,0,0.8)]"
      >
        <i class="fa-solid fa-arrow-left"></i>
        <span class="mono text-[10px] tracking-widest">RETURN_TO_MAIN</span>
      </a>

      <!-- Header -->
      <div class="mb-16 border-b border-white/10 pb-8">
        <p class="mono text-red-600 text-xs tracking-[0.5em] mb-4 uppercase">
          Secure_File // Editable
        </p>
        <h1
          class="text-4xl md:text-6xl font-black uppercase tracking-tighter text-white"
        >
          Subject
          <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-red-900"
            >Dossier</span
          >
        </h1>
        <h2
          id="dossier-name"
          class="mono text-gray-500 text-sm mt-2 tracking-widest uppercase"
        ></h2>
      </div>

      <!-- Profile Header Card -->
      <div id="profileHeader" class="mb-12"></div>

      <!-- Dossier Content Grid -->
      <div
        class="grid grid-cols-1 lg:grid-cols-3 gap-10"
        id="dossierContent"
      ></div>
    </div>

    <!-- Background Glow -->
    <div
      class="fixed inset-0 pointer-events-none z-0"
      style="
        background: radial-gradient(
          circle at right top,
          var(--k-red-transparent) 0%,
          transparent 50%
        );
      "
    ></div>

    <!-- INPUT MODAL (reused from main page) -->
    <div id="input-modal">
      <div
        class="bg-black border border-red-600 p-8 w-full max-w-md relative shadow-[0_0_30px_rgba(255,0,0,0.15)]"
      >
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <h3
          id="input-modal-title"
          class="text-red-600 mono uppercase tracking-widest font-bold mb-6"
        >
          Enter Data
        </h3>
        <div id="input-modal-body" class="flex flex-col gap-4"></div>
        <div class="flex gap-4 mt-8">
          <button
            onclick="closeInputModal()"
            class="flex-1 py-3 border border-white/20 text-gray-400 hover:text-white uppercase mono text-xs"
          >
            Cancel
          </button>
          <button
            id="input-modal-save"
            class="flex-1 py-3 bg-red-600 text-white font-bold uppercase mono text-xs hover:bg-white hover:text-black transition-colors"
          >
            Save_Data
          </button>
        </div>
      </div>
    </div>

    <!-- TERMINAL MODAL -->
    <div id="terminal-modal">
      <div class="terminal-box">
        <div id="terminal-text" class="flex flex-col gap-2 text-sm"></div>
        <div
          class="mt-4 border-t border-[#333] pt-2 flex justify-between items-center text-gray-500 text-xs"
        >
          <span
            >Status:
            <span id="term-status" class="text-yellow-500 animate-pulse"
              >PROCESSING...</span
            ></span
          >
          <span class="mono">NODE_JS // HACKERRANK_API</span>
        </div>
      </div>
    </div>
  </body>
</html>
